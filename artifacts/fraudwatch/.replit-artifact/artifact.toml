kind = "web"
previewPath = "/"
title = "FraudWatch"
version = "1.0.0"
id = "artifacts/fraudwatch"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22742

[services.development]
run = "pnpm --filter @workspace/fraudwatch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fraudwatch", "run", "build" ]
serve = "static"
publicDir = "artifacts/fraudwatch/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22742"
BASE_PATH = "/"
