<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FraudWatch AI - Sign In</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-bg {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
      position: relative;
    }

    .auth-brand-top {
      position: absolute;
      top: 32px;
      left: 32px;
    }

    .auth-card-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>

<body>


  <div class="screen">
    <div class="auth-bg">
      <div class="auth-brand-top">
        <a href="01_home.html" class="brand-logo-link">
          <svg class="brand-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
          <span>FraudWatch</span>
        </a>
      </div>

      <div class="auth-card-box">
        <div style="text-align: center; margin-bottom: 24px;">
          <h2 style="font-size: 1.35rem; font-weight: 700; color: var(--foreground);">Sign in to FraudWatch</h2>
          <p style="font-size: 0.875rem; color: var(--muted-foreground); margin-top: 4px;">Welcome back! Please enter
            your credentials.</p>
        </div>

        <form action="04_dashboard.html" style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 0.8rem; font-weight: 600; color: var(--muted-foreground);">Email Address or
              Username</label>
            <input type="email" class="ui-input" value="jay.analyst@fraudwatch.ai">
          </div>

          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div class="flex-between">
              <label style="font-size: 0.8rem; font-weight: 600; color: var(--muted-foreground);">Password</label>
              <a href="#" style="font-size: 0.75rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
            </div>
            <input type="password" class="ui-input" value="••••••••••••">
          </div>

          <div class="flex-align" style="font-size: 0.8rem; color: var(--muted-foreground);">
            <input type="checkbox" id="remember" checked style="accent-color: var(--primary);">
            <label for="remember">Remember this device for 30 days</label>
          </div>

          <a href="04_dashboard.html" class="btn btn-primary" style="width: 100%; height: 40px; margin-top: 8px;">Sign
            In</a>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--muted-foreground);">
          Don't have an account? <a href="03_signup.html"
            style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign up</a>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
